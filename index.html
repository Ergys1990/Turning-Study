<style>
:root{--au-bg:#f6f6f4;--au-card:#ffffff;--au-ink:#111111;--au-ink2:#5b5b57;--au-bd:#d2d2cc;--au-acc:#e4002b;--au-on:#ffffff;--au-err:#b3261e;--au-ok:#146c43;--au-info:#1f4e8c;--au-field:#ffffff;--au-warnbg:#fdecea;--au-okbg:#e7f4ec;--au-infobg:#e8f0fb;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--au-bg:#000000;--au-card:#0d0d0d;--au-ink:#ffffff;--au-ink2:#b4b4b4;--au-bd:#333333;--au-acc:#ffffff;--au-on:#000000;--au-err:#ff8a80;--au-ok:#7fe0a6;--au-info:#8ab4f8;--au-field:#161616;--au-warnbg:#2b1212;--au-okbg:#10261a;--au-infobg:#12203a;}}
:root[data-theme="dark"]{--au-bg:#000000;--au-card:#0d0d0d;--au-ink:#ffffff;--au-ink2:#b4b4b4;--au-bd:#333333;--au-acc:#ffffff;--au-on:#000000;--au-err:#ff8a80;--au-ok:#7fe0a6;--au-info:#8ab4f8;--au-field:#161616;--au-warnbg:#2b1212;--au-okbg:#10261a;--au-infobg:#12203a;}
html,body{margin:0;height:100%;}
body{background:var(--au-bg);}
#authGate{position:fixed;inset:0;z-index:2147483000;background:var(--au-bg);display:grid;place-items:center;overflow:auto;padding:16px;box-sizing:border-box;font:14px/1.5 "Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif;color:var(--au-ink);}
#authGate[hidden]{display:none!important;}
#authGate.au-modal{background:rgba(0,0,0,.58);}
#authGate.au-modal .au-brand,#authGate.au-modal .au-foot{display:none;}
#authGate *{box-sizing:border-box;}
#authGate .au-wrap{width:100%;max-width:420px;margin:auto;}
#authGate .au-brand{display:flex;align-items:baseline;gap:12px;margin:0 4px 14px;}
#authGate .au-som{font-size:22px;letter-spacing:.42em;font-weight:300;color:var(--au-ink);}
#authGate .au-som b{font-weight:300;color:#e4002b;}
#authGate .au-app{font-size:13px;color:var(--au-ink2);}
#authGate .au-card{background:var(--au-card);border:1px solid var(--au-bd);border-radius:14px;padding:26px 24px 22px;box-shadow:0 18px 50px rgba(0,0,0,.14);}
#authGate h1{font-size:21px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em;color:var(--au-ink);}
#authGate .au-p{margin:4px 0 14px;color:var(--au-ink2);font-size:13.5px;}
#authGate .au-p b{color:var(--au-ink);font-weight:600;}
#authGate label.au-l{display:block;margin:14px 0 5px;font-size:12.5px;font-weight:600;color:var(--au-ink);letter-spacing:0;text-transform:none;}
#authGate .au-field{position:relative;}
#authGate input.au-in{display:block;width:100%;height:46px;padding:0 14px;margin:0;font:16px "Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--au-ink);background:var(--au-field);border:1px solid var(--au-bd);border-radius:9px;outline:none;box-shadow:none;}
#authGate input.au-in:focus{border-color:var(--au-ink);box-shadow:0 0 0 3px rgba(120,120,120,.25);}
#authGate input.au-pw{padding-right:68px;}
#authGate button.au-eye{position:absolute;right:6px;top:6px;height:34px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--au-ink2);font:600 12px "Helvetica Neue",Arial,sans-serif;cursor:pointer;}
#authGate button.au-eye:hover{color:var(--au-ink);}
#authGate button.au-btn{display:block;width:100%;height:46px;margin:20px 0 0;padding:0 14px;border:0;border-radius:9px;background:var(--au-acc);color:var(--au-on);font:600 15px "Helvetica Neue",Helvetica,Arial,sans-serif;cursor:pointer;letter-spacing:0;}
#authGate button.au-btn:hover{filter:brightness(.92);}
#authGate button.au-btn:disabled{opacity:.55;cursor:not-allowed;filter:none;}
#authGate button.au-btn.au-sec{background:transparent;color:var(--au-ink);border:1px solid var(--au-bd);margin-top:10px;}
#authGate button.au-link,#authGate a.au-link{background:none;border:0;padding:0;margin:0;font:inherit;font-size:13px;color:var(--au-ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;}
#authGate .au-row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;}
#authGate .au-msg{margin:10px 0 0;padding:10px 12px;border-radius:9px;font-size:13px;border:1px solid transparent;}
#authGate .au-msg[hidden]{display:none;}
#authGate .au-msg.au-err{background:var(--au-warnbg);color:var(--au-err);border-color:var(--au-err);}
#authGate .au-msg.au-ok{background:var(--au-okbg);color:var(--au-ok);border-color:var(--au-ok);}
#authGate .au-msg.au-info{background:var(--au-infobg);color:var(--au-info);border-color:var(--au-info);}
#authGate .au-meter{display:flex;gap:4px;margin:8px 0 2px;}
#authGate .au-meter i{flex:1;height:4px;border-radius:2px;background:var(--au-bd);}
#authGate .au-meter i.on{background:var(--au-ink);}
#authGate .au-hint{font-size:12px;color:var(--au-ink2);min-height:16px;}
#authGate .au-spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--au-bd);border-top-color:var(--au-ink);margin:2px 0 14px;animation:au-r .8s linear infinite;}
@keyframes au-r{to{transform:rotate(360deg);}}
#authGate .au-ol{margin:8px 0 10px;padding-left:20px;color:var(--au-ink2);font-size:13.5px;}
#authGate .au-ol li{margin:6px 0;}
#authGate code{font:12.5px ui-monospace,Menlo,Consolas,monospace;background:var(--au-bd);color:var(--au-ink);padding:1px 5px;border-radius:4px;}
#authGate .au-foot{margin:14px 6px 0;font-size:11.5px;color:var(--au-ink2);text-align:center;}
.au-noscript{position:fixed;inset:0;z-index:2147483001;display:grid;place-items:center;background:#fff;color:#111;font:16px Arial,sans-serif;padding:24px;text-align:center;}
#auMenu{position:fixed;z-index:2147482000;min-width:230px;max-width:calc(100vw - 16px);background:var(--au-card);color:var(--au-ink);border:1px solid var(--au-bd);border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.28);padding:6px;font:13px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;}
#auMenu .au-who{padding:8px 10px 8px;border-bottom:1px solid var(--au-bd);margin-bottom:4px;}
#auMenu .au-who small{display:block;color:var(--au-ink2);font-size:11px;}
#auMenu .au-who b{display:block;font-weight:600;word-break:break-all;}
#auMenu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--au-ink);padding:9px 10px;border-radius:7px;font:inherit;cursor:pointer;}
#auMenu button:hover{background:var(--au-bd);}
</style>

<body>
<div id="authGate" role="dialog" aria-modal="true" aria-labelledby="auTitle">
  <div class="au-wrap">
    <div class="au-brand"><span class="au-som">S<b>O</b>M</span><span class="au-app">Turning &amp; Circulation Studio</span></div>
    <div id="authCard" class="au-card" aria-live="polite"></div>
    <div class="au-foot">Scripted by Ergys Peka · Washington DC</div>
  </div>
</div>
<noscript><div class="au-noscript">This tool needs JavaScript. Please turn it on and reload the page.</div></noscript>

<script>
(function(){
'use strict';
var cfg=Object.assign({SUPABASE_URL:'',SUPABASE_ANON_KEY:'',ALLOWED_EMAIL_DOMAINS:[],IDLE_MINUTES:0,MIN_PASSWORD_LENGTH:10,RESEND_COOLDOWN_SECONDS:60,PROTECT_APP:true,APP_BUCKET:'app',APP_FILE:'studio.html'},window.AUTH_CONFIG||{});
var gate=document.getElementById('authGate'),card=document.getElementById('authCard');
var sb=null,inviteFlow=false,appLoaded=false,entering=false,recovering=false,locked=false,lastEmail=null,view='',ctx={},pendingNote=null,idleT=null,changeMode=false;
var notConfigured=!cfg.SUPABASE_URL||/YOUR-|your-project/i.test(cfg.SUPABASE_URL)||!cfg.SUPABASE_ANON_KEY||/YOUR-|your-/i.test(cfg.SUPABASE_ANON_KEY);

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function redirect(){return location.href.split('#')[0].split('?')[0];}
function cleanUrl(){try{history.replaceState(null,'',location.pathname);}catch(e){}}

function pwCheck(pw,email){
  var min=+cfg.MIN_PASSWORD_LENGTH||10,local=(email||'').split('@')[0].toLowerCase();
  if(pw.length<min)return{ok:false,text:'Use at least '+min+' characters.'};
  if(!/[a-z]/i.test(pw)||!/\d/.test(pw))return{ok:false,text:'Include letters and at least one number.'};
  var lowPw=pw.toLowerCase(),fullEmail=(email||'').toLowerCase();
  if((fullEmail&&lowPw.indexOf(fullEmail)>=0)||(local.length>=4&&lowPw.indexOf(local)>=0))return{ok:false,text:'Don’t include your email address in the password.'};
  if(/^(.)\1+$/.test(pw))return{ok:false,text:'Choose a less repetitive password.'};
  return{ok:true};
}
function pwScore(pw){var min=+cfg.MIN_PASSWORD_LENGTH||10,s=0;if(pw.length>=min)s++;if(pw.length>=min+4)s++;if(/[A-Z]/.test(pw)&&/[a-z]/.test(pw))s++;if(/\d/.test(pw)&&/[^A-Za-z0-9]/.test(pw))s++;return s;}
function nice(err){
  var m=((err&&err.message)||'')+'',c=(err&&err.code)||'',st=err&&err.status;
  if(c==='email_not_confirmed'||/not confirmed/i.test(m))return{kind:'unconfirmed',text:'Please confirm your email address first. We can send the link again.'};
  if(st===429||c==='over_email_send_rate_limit'||c==='over_request_rate_limit'||/rate limit|too many/i.test(m))return{text:'Too many attempts. Please wait a minute and try again.'};
  if(c==='invalid_credentials'||/invalid login/i.test(m))return{text:'That email and password don’t match. Check them, or reset your password.'};
  if(c==='same_password'||/different from the old|same as the old/i.test(m))return{text:'Choose a password you haven’t used before.'};
  if(c==='signup_disabled'||/signups? not allowed/i.test(m))return{text:'Self-registration is switched off. Ask the administrator to invite you.'};
  if(/database error saving new user/i.test(m))return{text:'Registration is limited to approved email addresses.'};
  if(c==='weak_password'||/password should|weak/i.test(m))return{text:'That password is too weak. Use a longer one with letters and numbers.'};
  if(/failed to fetch|network|load failed/i.test(m))return{text:'Can’t reach the sign-in service. Check your connection and try again.'};
  return{text:'Something went wrong. Please try again.'};
}

function msg(type,text,html){var el=document.getElementById('auMsg');if(!el)return;el.className='au-msg au-'+type;el.hidden=false;if(html)el.innerHTML=html;else el.textContent=text;}
function noteHtml(n){return n?'<div id="auMsg" class="au-msg au-'+n.type+'" role="alert">'+(n.html||esc(n.text))+'</div>':'<div id="auMsg" class="au-msg" role="alert" hidden></div>';}
function fld(id,label,type,ac,val,extra){return '<label class="au-l" for="'+id+'">'+label+'</label><div class="au-field"><input class="au-in'+(type==='password'?' au-pw':'')+'" id="'+id+'" name="'+id+'" type="'+type+'" autocomplete="'+ac+'" '+(type==='email'?'inputmode="email" autocapitalize="none" spellcheck="false" ':'')+(val?'value="'+esc(val)+'" ':'')+(extra||'')+' required>'+(type==='password'?'<button type="button" class="au-eye" data-eye="'+id+'" aria-label="Show or hide password">Show</button>':'')+'</div>';}
function meter(){return '<div class="au-meter" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="au-hint" id="auHint">At least '+(+cfg.MIN_PASSWORD_LENGTH||10)+' characters, with letters and a number.</div>';}

var V={
 loading:function(c){return '<div class="au-spin" aria-hidden="true"></div><h1 id="auTitle">'+esc(c.title||'Please wait')+'</h1><p class="au-p">'+esc(c.text||'')+'</p>';},
 setup:function(){return '<h1 id="auTitle">Sign-in isn’t set up yet</h1><p class="au-p">This copy of the tool stays locked until it is connected to a sign-in service.</p><ol class="au-ol"><li>Create a free Supabase project.</li><li>Open <code>auth-config.js</code> and paste in the project URL and the public (anon) key.</li><li>Upload the file to GitHub again and reload this page.</li></ol><p class="au-p">The full steps are in <b>README.md</b>.</p>';},
 fatal:function(c){return '<h1 id="auTitle">'+esc(c.title)+'</h1><p class="au-p">'+esc(c.text)+'</p>'+(c.retry?'<button class="au-btn" type="button" data-act="reload">Try again</button>':'')+(c.back?'<button class="au-btn au-sec" type="button" data-go="signin">Back to sign in</button>':'');},
 signin:function(c){return '<h1 id="auTitle">Sign in</h1><p class="au-p">Use the account you registered with.</p>'+noteHtml(c.note)+'<form id="auForm" novalidate>'+fld('auEmail','Email','email','username',c.email)+fld('auPw','Password','password','current-password','')+'<button class="au-btn" type="submit" id="auGo">Sign in</button></form><div class="au-row"><button class="au-link" type="button" data-go="forgot">Forgot password?</button><button class="au-link" type="button" data-go="register">Create an account</button></div>';},
 register:function(c){return '<h1 id="auTitle">Create an account</h1><p class="au-p">We’ll email you a link to confirm your address.</p>'+noteHtml(c.note)+'<form id="auForm" novalidate>'+fld('auEmail','Work email','email','username',c.email)+fld('auPw','Choose a password','password','new-password','')+meter()+fld('auPw2','Repeat the password','password','new-password','')+'<button class="au-btn" type="submit" id="auGo">Create account</button></form><div class="au-row"><button class="au-link" type="button" data-go="signin">I already have an account</button></div>';},
 forgot:function(c){return '<h1 id="auTitle">Reset your password</h1><p class="au-p">Enter your email and we’ll send you a link to choose a new password.</p>'+noteHtml(c.note)+'<form id="auForm" novalidate>'+fld('auEmail','Email','email','username',c.email)+'<button class="au-btn" type="submit" id="auGo">Email me a reset link</button></form><div class="au-row"><button class="au-link" type="button" data-go="signin">Back to sign in</button></div>';},
 sent:function(c){return '<h1 id="auTitle">Check your email</h1><p class="au-p">'+c.text+'</p>'+noteHtml(c.note)+'<button class="au-btn au-sec" type="button" id="auResend" data-act="resend">Send it again</button><div class="au-row"><button class="au-link" type="button" data-go="signin">Back to sign in</button></div>';},
 reset:function(c){return '<h1 id="auTitle">'+(c.change?'Change your password':(c.invite?'Welcome — choose a password':'Choose a new password'))+'</h1><p class="au-p">'+(c.change?'Enter a new password for your account.':(c.invite?'Your invitation worked. Choose a password to finish setting up your account.':'Your link worked. Pick a new password to finish.'))+'</p>'+noteHtml(c.note)+'<form id="auForm" novalidate>'+fld('auPw','New password','password','new-password','')+meter()+fld('auPw2','Repeat the password','password','new-password','')+'<button class="au-btn" type="submit" id="auGo">Save new password</button></form>'+(c.change?'<div class="au-row"><button class="au-link" type="button" data-act="cancelchange">Cancel</button></div>':'');}
};

function show(v,c){
  view=v;ctx=c||{};card.innerHTML=V[v](ctx);
  var first=card.querySelector('input');if(first&&v!=='loading'){try{first.focus({preventScroll:true});}catch(e){}}
  if(v==='sent')cool(document.getElementById('auResend'),+cfg.RESEND_COOLDOWN_SECONDS||60,'Send it again');
  var p=document.getElementById('auPw');
  if(p&&v!=='signin'){p.addEventListener('input',function(){
    var s=pwScore(p.value),is=card.querySelectorAll('.au-meter i');is.forEach(function(i,k){i.className=k<s?'on':'';});
    var h=document.getElementById('auHint');if(h){var ck=pwCheck(p.value,(document.getElementById('auEmail')||{}).value||'');h.textContent=!p.value?'At least '+(+cfg.MIN_PASSWORD_LENGTH||10)+' characters, with letters and a number.':(ck.ok?['Okay','Good','Strong','Very strong','Very strong'][Math.min(4,s)]:ck.text);}});}
}
function cool(btn,sec,label){if(!btn)return;btn.disabled=true;var n=sec;btn.textContent=label+' ('+n+'s)';var t=setInterval(function(){n--;if(!document.body.contains(btn)){clearInterval(t);return;}btn.textContent=n>0?label+' ('+n+'s)':label;if(n<=0){clearInterval(t);btn.disabled=false;}},1000);}
function busy(btn,on,label){if(!btn)return;btn.disabled=on;if(label)btn.textContent=label;}
function val(id){var e=document.getElementById(id);return e?e.value:'';}
function emailOk(e){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);}
function domainOk(e){var d=(cfg.ALLOWED_EMAIL_DOMAINS||[]).map(function(x){return String(x).toLowerCase().replace(/^@/,'');});if(!d.length)return true;return d.indexOf(e.split('@')[1].toLowerCase())>=0;}

card.addEventListener('click',function(e){
  var eye=e.target.closest('[data-eye]');
  if(eye){var inp=document.getElementById(eye.getAttribute('data-eye')),show_=inp.type==='password';inp.type=show_?'text':'password';eye.textContent=show_?'Hide':'Show';return;}
  var go=e.target.closest('[data-go]');
  if(go){show(go.getAttribute('data-go'),{email:val('auEmail')});return;}
  var act=e.target.closest('[data-act]');if(!act)return;var a=act.getAttribute('data-act');
  if(a==='reload')location.reload();
  else if(a==='cancelchange')closeModal();
  else if(a==='resend')resend(act);
});
card.addEventListener('submit',function(e){
  e.preventDefault();var f={signin:doSignin,register:doRegister,forgot:doForgot,reset:doReset}[view];if(f)f();
});

function doSignin(){
  var email=val('auEmail').trim(),pw=val('auPw'),btn=document.getElementById('auGo');
  if(!emailOk(email))return msg('err','Enter a valid email address.');
  if(!pw)return msg('err','Enter your password.');
  busy(btn,true,'Signing in…');
  sb.auth.signInWithPassword({email:email,password:pw}).then(function(r){
    if(r.error){busy(btn,false,'Sign in');var n=nice(r.error);
      if(n.kind==='unconfirmed'){ctx.email=email;msg('err','',esc(n.text)+' <button class="au-link" type="button" id="auRe">Send the link again</button>');var b=document.getElementById('auRe');if(b)b.onclick=function(){sendConfirm(email);};}
      else msg('err',n.text);return;}
    if(r.data&&r.data.session)enter(r.data.session);
  }).catch(function(x){busy(btn,false,'Sign in');msg('err',nice(x).text);});
}
function sendConfirm(email){
  sb.auth.resend({type:'signup',email:email,options:{emailRedirectTo:redirect()}}).then(function(r){
    if(r.error)msg('err',nice(r.error).text);else show('sent',{email:email,kind:'signup',text:'We sent a confirmation link to <b>'+esc(email)+'</b>. Open it to activate your account, then sign in.'});
  }).catch(function(x){msg('err',nice(x).text);});
}
function doRegister(){
  var email=val('auEmail').trim(),pw=val('auPw'),pw2=val('auPw2'),btn=document.getElementById('auGo');
  if(!emailOk(email))return msg('err','Enter a valid email address.');
  if(!domainOk(email))return msg('err','Registration is limited to approved email addresses ('+(cfg.ALLOWED_EMAIL_DOMAINS||[]).map(function(d){return '@'+String(d).replace(/^@/,'');}).join(', ')+').');
  var ck=pwCheck(pw,email);if(!ck.ok)return msg('err',ck.text);
  if(pw!==pw2)return msg('err','The two passwords don’t match.');
  busy(btn,true,'Creating account…');
  sb.auth.signUp({email:email,password:pw,options:{emailRedirectTo:redirect()}}).then(function(r){
    if(r.error){busy(btn,false,'Create account');return msg('err',nice(r.error).text);}
    if(r.data&&r.data.session){enter(r.data.session);return;}
    show('sent',{email:email,kind:'signup',text:'We sent a confirmation link to <b>'+esc(email)+'</b>. Open it to activate your account, then sign in. If you already have an account, use “Forgot password?” instead.'});
  }).catch(function(x){busy(btn,false,'Create account');msg('err',nice(x).text);});
}
function doForgot(){
  var email=val('auEmail').trim(),btn=document.getElementById('auGo');
  if(!emailOk(email))return msg('err','Enter a valid email address.');
  busy(btn,true,'Sending…');requestReset(email,btn);
}
function requestReset(email,btn){
  sb.auth.resetPasswordForEmail(email,{redirectTo:redirect()}).then(function(r){
    if(r.error){busy(btn,false,'Email me a reset link');return msg('err',nice(r.error).text);}
    show('sent',{email:email,kind:'reset',text:'If an account exists for <b>'+esc(email)+'</b>, a password-reset link is on its way. The link can be used once and expires soon.'});
  }).catch(function(x){busy(btn,false,'Email me a reset link');msg('err',nice(x).text);});
}
function resend(btn){
  var email=ctx.email;if(!email)return;busy(btn,true);
  var p=ctx.kind==='reset'?sb.auth.resetPasswordForEmail(email,{redirectTo:redirect()}):sb.auth.resend({type:'signup',email:email,options:{emailRedirectTo:redirect()}});
  p.then(function(r){if(r.error){btn.disabled=false;return msg('err',nice(r.error).text);}msg('ok','Sent again. Check your inbox and spam folder.');cool(btn,+cfg.RESEND_COOLDOWN_SECONDS||60,'Send it again');}).catch(function(x){btn.disabled=false;msg('err',nice(x).text);});
}
function doReset(){
  var pw=val('auPw'),pw2=val('auPw2'),btn=document.getElementById('auGo');
  var ck=pwCheck(pw,lastEmail||'');if(!ck.ok)return msg('err',ck.text);
  if(pw!==pw2)return msg('err','The two passwords don’t match.');
  busy(btn,true,'Saving…');
  sb.auth.updateUser({password:pw}).then(function(r){
    if(r.error){busy(btn,false,'Save new password');return msg('err',nice(r.error).text);}
    recovering=false;inviteFlow=false;cleanUrl();
    if(ctx.change){closeModal();if(window.toast)window.toast('Password changed.');return;}
    sb.auth.getSession().then(function(g){var s=g&&g.data&&g.data.session;if(s)enter(s,'Password updated — you are signed in.');else show('signin',{note:{type:'ok',text:'Password updated. Sign in with the new one.'}});});
  }).catch(function(x){busy(btn,false,'Save new password');msg('err',nice(x).text);});
}

function inertOthers(on){Array.prototype.forEach.call(document.body.children,function(el){if(el===gate||el.tagName==='SCRIPT'||el.tagName==='NOSCRIPT')return;if(on)el.setAttribute('inert','');else el.removeAttribute('inert');});}
function unlock(){locked=false;changeMode=false;inertOthers(false);gate.classList.remove('au-modal');gate.hidden=true;armIdle();}
function lock(note){locked=true;clearTimeout(idleT);closeMenu();inertOthers(true);gate.classList.remove('au-modal');gate.hidden=false;show('signin',{note:note,email:lastEmail||''});}
function closeModal(){if(changeMode){changeMode=false;gate.classList.remove('au-modal');gate.hidden=true;inertOthers(false);locked=false;armIdle();}}
function armIdle(){
  if(!(+cfg.IDLE_MINUTES>0)||!appLoaded||locked)return;clearTimeout(idleT);
  idleT=setTimeout(function(){try{sb.auth.signOut();}catch(e){}lock({type:'info',text:'You were signed out after '+cfg.IDLE_MINUTES+' minutes of inactivity.'});},cfg.IDLE_MINUTES*60000);
}
['pointerdown','keydown','wheel','touchstart'].forEach(function(ev){window.addEventListener(ev,armIdle,{passive:true,capture:true});});

function enter(session,toastText){
  if(entering||!session)return;var email=(session.user&&session.user.email)||'';
  if(appLoaded){if(lastEmail&&email&&email!==lastEmail){location.replace(location.pathname);return;}lastEmail=email||lastEmail;unlock();if(toastText&&window.toast)window.toast(toastText);return;}
  entering=true;lastEmail=email;show('loading',{title:'Opening the studio…',text:'One moment.'});
  loadApp().then(function(){appLoaded=true;entering=false;unlock();try{window.dispatchEvent(new Event('resize'));}catch(e){}if(toastText&&window.toast)window.toast(toastText);})
  .catch(function(err){entering=false;
    var missing=err&&err.message==='app-missing';
    show('fatal',{title:missing?'The studio file isn’t available':'Couldn’t open the studio',text:missing?'You are signed in, but the studio file could not be loaded. Ask the administrator to check the “app” storage bucket and its access policy (README, step 5).':'Something went wrong while opening the tool. Reload the page and try again.',retry:true});});
}
function loadApp(){
  var p;
  if(cfg.PROTECT_APP!==false){
    p=sb.storage.from(cfg.APP_BUCKET||'app').download(cfg.APP_FILE||'studio.html').then(function(r){if(r.error||!r.data)throw new Error('app-missing');return r.data.text();});
  }else{
    p=fetch(cfg.APP_FILE||'studio.html',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('app-missing');return r.text();});
  }
  return p.then(function(html){
    var doc=new DOMParser().parseFromString(html,'text/html');
    if(doc.title)document.title=doc.title;
    doc.head.querySelectorAll('style').forEach(function(s){var n=document.createElement('style');n.textContent=s.textContent;document.head.appendChild(n);});
    var scripts=[].concat(Array.prototype.slice.call(doc.head.querySelectorAll('script')),Array.prototype.slice.call(doc.body.querySelectorAll('script')));
    scripts.forEach(function(s){if(s.parentNode)s.parentNode.removeChild(s);});
    Array.prototype.slice.call(doc.body.childNodes).forEach(function(n){document.body.appendChild(document.importNode(n,true));});
    scripts.forEach(function(s){if(s.src||s.getAttribute('src'))return;var n=document.createElement('script');n.textContent=s.textContent;document.body.appendChild(n);});
  });
}

var menuEl=null;
function closeMenu(){if(menuEl){menuEl.remove();menuEl=null;}}
function openMenu(anchor){
  if(menuEl){closeMenu();return;}
  var m=document.createElement('div');m.id='auMenu';m.setAttribute('role','menu');
  m.innerHTML='<div class="au-who"><small>Signed in as</small><b></b></div><button type="button" data-m="pw" role="menuitem">Change password</button><button type="button" data-m="out" role="menuitem">Sign out</button>';
  m.querySelector('b').textContent=lastEmail||'your account';
  document.body.appendChild(m);menuEl=m;
  var r=anchor?anchor.getBoundingClientRect():{left:40,bottom:48,right:240};
  var top=r.bottom+6;if(top+m.offsetHeight>innerHeight-8)top=Math.max(8,(r.top||innerHeight/2)-m.offsetHeight-6);
  m.style.top=Math.round(Math.min(top,innerHeight-m.offsetHeight-8))+'px';m.style.left=Math.max(8,Math.min(innerWidth-m.offsetWidth-8,Math.round(r.right-m.offsetWidth)))+'px';
  m.addEventListener('click',function(e){var b=e.target.closest('[data-m]');if(!b)return;closeMenu();if(b.getAttribute('data-m')==='pw')changePassword();else signOut();});
  setTimeout(function(){document.addEventListener('pointerdown',away,true);},0);
  function away(e){if(menuEl&&!menuEl.contains(e.target)&&!(anchor&&anchor.contains(e.target))){closeMenu();document.removeEventListener('pointerdown',away,true);}}
}
function changePassword(){changeMode=true;locked=true;clearTimeout(idleT);inertOthers(true);gate.classList.add('au-modal');gate.hidden=false;show('reset',{change:true});}
function signOut(){
  var hasWork=false;try{hasWork=(typeof S!=='undefined')&&((S.paths&&S.paths.length)||(S.annos&&S.annos.length));}catch(e){}
  if(hasWork&&!confirm('Sign out?\n\nAnything you have not saved will be lost. Use Export & Save → Save project first if you want to keep it.'))return;
  var go=function(){location.replace(location.pathname);};
  try{sb.auth.signOut().then(go,go);}catch(e){go();}
}
window.AuthUI={menu:openMenu,signOut:signOut,changePassword:changePassword,email:function(){return lastEmail;}};
window.addEventListener('keydown',function(e){if(e.key==='Escape'){if(menuEl)closeMenu();else if(changeMode)closeModal();}});

function onAuth(ev,session){
  if(session&&inviteFlow&&!appLoaded){lastEmail=(session.user&&session.user.email)||lastEmail;if(view!=='reset'){cleanUrl();show('reset',{invite:true});}return;}
  if(ev==='PASSWORD_RECOVERY'){recovering=true;if(session&&session.user&&session.user.email)lastEmail=session.user.email;cleanUrl();if(appLoaded){locked=true;inertOthers(true);gate.hidden=false;}show('reset',{});return;}
  if(ev==='SIGNED_OUT'){if(appLoaded&&!locked)lock({type:'info',text:'You have been signed out.'});return;}
  if(session&&!recovering){cleanUrl();enter(session,ev==='SIGNED_IN'&&/type=signup/.test(location.hash+'')?'Email confirmed — welcome.':'');return;}
  if(ev==='INITIAL_SESSION'&&!session){cleanUrl();if(!recovering&&view==='loading')show('signin',{note:pendingNote});}
}
function boot(){
  if(notConfigured){show('setup');return;}
  if(!window.supabase||!window.supabase.createClient){show('fatal',{title:'Can’t reach the sign-in service',text:'The sign-in library didn’t load. Check your connection and reload the page.',retry:true});return;}
  var h=new URLSearchParams(location.hash.replace(/^#/,'')),q=new URLSearchParams(location.search);
  recovering=/type=recovery/.test(location.hash);inviteFlow=/type=invite/.test(location.hash);if(inviteFlow)recovering=false;
  if(h.get('error_description')||q.get('error_description')){pendingNote={type:'err',text:'That link has expired or was already used. Sign in, or choose “Forgot password?” to get a new one.'};}
  try{sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}});}
  catch(e){show('fatal',{title:'Can’t start sign-in',text:'The sign-in settings look wrong. Check auth-config.js.',retry:false});return;}
  show('loading',{title:'Checking your session…',text:''});
  sb.auth.onAuthStateChange(function(ev,session){setTimeout(function(){onAuth(ev,session);},0);});
  setTimeout(function(){
    if(view!=='loading'||appLoaded||entering)return;
    sb.auth.getSession().then(function(g){var s=g&&g.data&&g.data.session;if(s&&!recovering)enter(s);else show('signin',{note:pendingNote});}).catch(function(){show('signin',{note:pendingNote});});
  },6000);
}
boot();
})();
</script>
